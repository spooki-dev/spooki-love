name: CI

# Lints every Lua file with a real Lua 5.1 parser and runs the examples
# regression suite (examples/README.md) headlessly on Linux. Dispatch the
# workflow by hand with "update_snapshots" ticked to regenerate the golden
# screenshots on CI's renderer and commit them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate examples/__snapshots__ and commit them
        type: boolean
        default: false

env:
  LOVE_VERSION: "11.5"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used when update_snapshots is ticked
    steps:
      - uses: actions/checkout@v4

      - name: Cache LÖVE and the Lua 5.1 compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/love-release
            ~/love-appimage
          key: love-${{ env.LOVE_VERSION }}-lua515-${{ runner.os }}-v1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa libpulse0 zip
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Fetch LÖVE ${{ env.LOVE_VERSION }}
        run: |
          mkdir -p ~/love-appimage && cd ~/love-appimage
          if [ ! -x squashfs-root/AppRun ]; then
            curl -fsSL -o love.AppImage "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-x86_64.AppImage"
            chmod +x love.AppImage
            ./love.AppImage --appimage-extract >/dev/null
          fi
          squashfs-root/AppRun --version

      - name: Lint and run the examples suite
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ALSOFT_DRIVERS: "null"
          SDL_AUDIODRIVER: dummy
        run: |
          flags=""
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then flags="--update-snapshots"; fi
          LOVE="$HOME/love-appimage/squashfs-root/AppRun" \
            xvfb-run -a -s "-screen 0 1600x900x24" scripts/test.sh $flags

      - name: Upload failing screenshots and diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: examples/.test-output
          if-no-files-found: ignore

      - name: Commit regenerated goldens
        if: inputs.update_snapshots == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add examples/__snapshots__
          if git diff --cached --quiet; then
            echo "goldens unchanged"
          else
            git commit -m "test: update example snapshots"
            git push
          fi
