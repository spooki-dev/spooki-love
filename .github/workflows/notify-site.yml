name: Notify site of docs and examples changes

# Tells georgebutter/site to rebuild so https://spookidev.com/spooki-love/docs
# and /spooki-love/examples pick up new markdown, examples or engine code (the
# site bundles the engine into the examples' web build). Needs the
# SITE_DISPATCH_TOKEN secret: a personal access token with Contents
# read/write on georgebutter/site.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "engine/**"
      - "assets/**"
      - "constants/**"
      - "gameObjects/**"
      - "scenes/**"
      - "state/**"
      - "main.lua"
      - "conf.lua"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SITE_DISPATCH_TOKEN }}
          repository: georgebutter/site
          event-type: spooki-love-docs
          client-payload: '{"sha": "${{ github.sha }}"}'
